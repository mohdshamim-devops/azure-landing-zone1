
name: Terraform Azure Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
           {
              "clientId": "3326e9bf-7fc5-4fd7-9176-489b5934c768",
              "clientSecret": "fYC8Q~nJ6g3OgcYZqKAp0xihCi.6WpeZjAyFSa0n",
              "subscriptionId": "c14887df-3ce2-44d2-adb8-4405e7e105d8",
              "tenantId": "4e86bdd1-0efb-47f9-a76d-517388c5e28f"
            }
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: "./landing zone"
        run: terraform init

      - name: Terraform Validate
        working-directory: "./landing zone"
        run: terraform validate

      - name: Terraform Plan
        working-directory: "./landing zone"
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: "./landing zone/tfplan"


  terraform-apply:
    name: Terraform Apply
    needs: terraform-plan
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
           {
              "clientId": "3326e9bf-7fc5-4fd7-9176-489b5934c768",
              "clientSecret": "fYC8Q~nJ6g3OgcYZqKAp0xihCi.6WpeZjAyFSa0n",
              "subscriptionId": "c14887df-3ce2-44d2-adb8-4405e7e105d8",
              "tenantId": "4e86bdd1-0efb-47f9-a76d-517388c5e28f"
            }

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: "./landing zone"
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: "./landing zone"

      - name: Terraform Apply
        working-directory: "./landing zone"
        run: terraform apply -auto-approve tfplan
